[build-system]
requires = ["setuptools>=84.1.0", "pybind11>=2.13,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "OrbitServe"
version = "0.0.1"
description = "Native fixed-design LEO AI serving simulation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6",
  "astropy==6.1.3",
  "astropy-iers-data==0.2026.5.11.1.8.52",
  "sgp4==2.27",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
simgrid = ["simgrid==4.1"]
ns3 = ["ns3==3.44.post0"]

[tool.setuptools]
include-package-data = false
packages = [
  "simulator",
  "network_sim",
  "integration",
  "orbitserve",
  "orbitserve.architecture",
  "orbitserve.architecture.single_satellite_cost",
  "orbitserve.baselines",
  "orbitserve.baselines.ground",
  "orbitserve.common",
  "orbitserve.experiments",
  "orbitserve.runtime",
  "orbitserve.runtime.engine",
  "orbitserve.runtime.setup",
  "orbitserve.runtime.state",
  "orbitserve.orbit",
  "orbitserve.orbit.sgp4",
  "orbitserve.orbit.validation",
  "orbitserve.workload",
]

[tool.setuptools.package-dir]
orbitserve = "src/orbitserve"
"orbitserve.experiments" = "src/experiments"
"orbitserve.baselines" = "src/baselines"
"orbitserve.baselines.ground" = "src/baselines/ground"

[tool.setuptools.package-data]
"simulator" = ["examples/*.json", "web/*.html", "web/*.css", "web/*.js"]
"integration" = ["runtime/*.json", "requirements-scheduler-latest.lock"]
"orbitserve.orbit" = [
  "data/iers/0.2026.5.11.1.8.52/*",
  "data/stk_validation/*.json",
]
