[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "OrbitServe"
version = "0.0.1"
description = "Private research artifact for OrbitServe LEO AI serving cost-SLO co-design."
requires-python = ">=3.11"
dependencies = [
  "astropy==6.1.3",
  "astropy-iers-data==0.2026.5.11.1.8.52",
  "sgp4==2.27",
  "pydantic>=2.7,<3",
]

[tool.setuptools]
packages = [
  "astermind",
  "astermind.ArchPrism",
  "astermind.ArchPrism.scheduler",
  "astermind.ArchPrism.midlayer",
  "astermind.ArchPrism.execution",
  "network_sim",
  "network_sim.physical",
  "network_sim.physical._vendor",
  "network_sim.comm",
  "orbitserve",
  "orbitserve.architecture",
  "orbitserve.architecture.single_satellite_cost",
  "orbitserve.baselines",
  "orbitserve.baselines.ground",
  "orbitserve.common",
  "orbitserve.dse",
  "orbitserve.experiments",
  "orbitserve.runtime",
  "orbitserve.runtime.engine",
  "orbitserve.runtime.metrics",
  "orbitserve.runtime.setup",
  "orbitserve.runtime.state",
  "orbitserve.serving",
  "orbitserve.orbit",
  "orbitserve.orbit.sgp4",
  "orbitserve.orbit.validation",
  "orbitserve.workload",
]

[tool.setuptools.package-dir]
astermind = "src/astermind"
network_sim = "src/network_sim"
orbitserve = "src/orbitserve"
"orbitserve.experiments" = "src/experiments"
"orbitserve.dse" = "src/dse"
"orbitserve.baselines" = "src/baselines"
"orbitserve.baselines.ground" = "src/baselines/ground"

[tool.setuptools.package-data]
"astermind.ArchPrism.scheduler" = ["runtime/*.json"]
"network_sim.physical" = ["_vendor/islsim/*.py"]
"network_sim.comm" = [
  "native/*.cc",
  "_vendor/flowsim/include/flowsim/*.hh",
  "_vendor/flowsim/src/*.cc",
  "_vendor/flowsim/tests/*.cc",
]
"orbitserve.orbit" = [
  "data/iers/0.2026.5.11.1.8.52/*",
  "data/stk_validation/*.json",
]
