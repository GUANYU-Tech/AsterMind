[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "AsterMind"
version = "0.0.1"
description = "Native fixed-design LEO AI serving simulation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6",
  "astropy==6.1.3",
  "astropy-iers-data==0.2026.5.11.1.8.52",
  "sgp4==2.27",
  "pydantic>=2.7,<3",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["astermind*", "viz", "workloads*", "examples", "examples.native"]
namespaces = false

[tool.setuptools.package-data]
"viz" = ["*.html", "*.css", "*.js"]
"examples.native" = ["*.json", "offline_config/*.json", "offline_config/*.jsonl"]
"workloads.main_composite_chat" = ["countries.csv", "gateways.json", "profiles/*.csv", "profiles/*.json"]
"astermind.engine.compute" = ["SOURCE.json", "scheduler_runtime/*", "upstream/**/*", "upstream/.orbitserve_snapshot.json"]
"astermind.engine.comm" = ["native_allocator.cc", "_vendor/**/*"]
"astermind.builder.orbit" = [
  "data/iers/0.2026.5.11.1.8.52/*",
  "data/stk_validation/*.json",
]
