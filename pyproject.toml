[build-system]
requires = ["setuptools>=84.1.0", "pybind11>=2.13,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "AsterMind"
version = "0.0.1"
description = "Native fixed-design LEO AI serving simulation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6",
  "astropy==6.1.3",
  "astropy-iers-data==0.2026.5.11.1.8.52",
  "sgp4==2.27",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
simgrid = ["simgrid==4.1"]
ns3 = ["ns3==3.44.post0"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["astermind*", "viz", "workloads*", "examples", "examples.native"]
namespaces = false

[tool.setuptools.package-data]
"viz" = ["*.html", "*.css", "*.js"]
"examples.native" = ["*.json"]
"workloads.main_composite_chat" = ["countries.csv", "gateways.json", "profiles/*.csv", "profiles/*.json"]
"astermind.engine.adapters" = ["runtime/*.json", "requirements-scheduler-latest.lock", "patches/*.patch", "*.patch"]
"astermind.builder.orbit" = [
  "data/iers/0.2026.5.11.1.8.52/*",
  "data/stk_validation/*.json",
]
