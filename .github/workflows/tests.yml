name: Tests

on:
  push:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core and native backend dependencies
        run: python -m pip install -e '.[simgrid,ns3]' 'ruff==0.14.0'
      - name: Lint
        run: python -m ruff check src tests
      - name: Full suite including slow and native backend regressions
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tests", top_level_dir=".")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print("Full native validation must not skip tests:", result.skipped)
          sys.exit(not result.wasSuccessful() or bool(result.skipped))
          PY
