name: Tests

on:
  push:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      # This workflow validates exported inputs, never the private ISLSim model.
      ORBITSERVE_ISLSIM_ROOT: /nonexistent/orbitserve-islsim-ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake libboost-dev pybind11-dev python3-dev
      - name: Install core and native backend dependencies
        run: |
          python -m pip install --upgrade 'pip==26.2.2'
          python -m pip install --build-constraint constraints/native-build.txt \
            -e '.[simgrid,ns3]' 'ruff==0.14.0'
      - name: Verify installed dependencies
        run: |
          python -m pip check
          python - <<'PY'
          from importlib import import_module
          from importlib.metadata import version

          for package in ("numpy", "astropy", "astropy-iers-data", "sgp4", "simgrid", "ns3"):
              print(f"{package}=={version(package)}", flush=True)
          for module in ("astropy.coordinates", "astropy.units"):
              import_module(module)
          print("Astropy coordinate and unit imports succeeded")
          PY
      - name: Lint
        run: python -m ruff check src tests .github/scripts
      - name: Verify native ns-3 packet transport
        run: python -m unittest tests.unit.runtime.test_ns3_transport -v
      - name: Full suite including slow and native backend regressions
        run: python .github/scripts/run_native_tests.py
