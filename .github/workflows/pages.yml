name: Deploy AsterMind homepage

on:
  pull_request:
    branches: [main]
    paths:
      - 'viz/homepage/**'
      - 'doc/AsterMind-V1-Tech-Report.pdf'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'viz/homepage/**'
      - 'doc/AsterMind-V1-Tech-Report.pdf'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            viz/homepage
            doc
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build the bilingual homepage
        run: python viz/homepage/build.py --pages-dir _site
      - name: Verify both homepages and the report
        run: |
          test -s _site/index.html
          test -s _site/en/index.html
          cmp doc/AsterMind-V1-Tech-Report.pdf _site/assets/AsterMind-V1-Tech-Report.pdf
      - name: Upload the static site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the homepage
        id: deployment
        uses: actions/deploy-pages@v4
