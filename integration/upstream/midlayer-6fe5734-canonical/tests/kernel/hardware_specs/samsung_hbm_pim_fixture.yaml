hardware_id: samsung_hbm_pim

# HWSpec test input: processing-in-memory hardware.
# Compute units are co-located with DRAM banks — no traditional SM hierarchy.

clock_domains:
  pim_core: 500000000
  dram: 1000000000

components:
  - name: pim_core
    count: 32
    children:
      - name: mac_unit
        role: compute_tensor
        scope: shared
        count: 1
        type: compute
        primary_variant: fp16
        variants:
          - name: fp16
            throughput_per_clk: 256
          - name: int8
            throughput_per_clk: 512
      - name: scalar_pipe
        role: compute_fma
        scope: shared
        count: 1
        type: compute
        throughput_per_clk: 4
      - name: sfu_pipe
        role: compute_sfu
        scope: shared
        count: 1
        type: compute
        throughput_per_clk: 2
      - name: alu_pipe
        role: compute_alu
        scope: shared
        count: 1
        type: compute
        throughput_per_clk: 4
      - name: local_buffer
        role: smem
        scope: shared
        count: 1
        type: memory
        throughput_per_clk: 256
        traffic_filter: null
      - name: l1_cache
        role: l1_cache
        scope: shared
        count: 1
        type: memory
        throughput_per_clk: 128
        traffic_filter: null

  - name: dram
    role: dram
    scope: shared
    clock_domain: dram
    count: 1
    type: memory
    throughput_per_clk: 1600
    traffic_filter: page_conflict
    size_bytes: 34359738368
    num_partitions: 8

  - name: l2
    role: l2_cache
    scope: shared
    clock_domain: pim_core
    count: 1
    type: memory
    throughput_per_clk: 1500
    traffic_filter: lru
    size_bytes: 8388608
    num_partitions: 16

  - name: xbar
    role: xbar
    scope: shared
    clock_domain: pim_core
    count: 1
    type: memory
    throughput_per_clk: 2000
    traffic_filter: null

resource_groups:
  - name: tensor_pipe
    members: [mac_unit_fp16]
  - name: fma_sfu_pipe
    members: [scalar_pipe, sfu_pipe]
  - name: alu_pipe
    members: [alu_pipe]
  - name: smem
    members: [local_buffer]
  - name: l1_cache
    members: [l1_cache]
  - name: xbar
    members: [xbar]
  - name: l2
    members: [l2]
  - name: dram
    members: [dram]

memory_subsystem:
  dram_latency_ns: 80            # PIM: near-memory, very low latency
  # PIM near-memory 架构里数据直接在 DRAM 旁就近计算，没有 GPU 式 L2 cache 层级。
  # 填 0 → 加载侧保持 fail-loud 强制取值不报错，物理上等价于"无 L2 hit 串行延迟修正"。
  l2_latency_ns: 0
  cacheline_bytes: 64
  l2_conflict_efficiency_moe: 0.9
  dram_protocol_efficiency: 0.95
  dram_protocol_efficiency_l1cached: 1.0
  profiler_per_kernel_traffic_reliable: true
  # No L2 cache layer on this PIM near-memory architecture; the t_l2_serial
  # correction is never gated for this hw (no FA/MOE predictors target PIM
  # paths). Sentinel 1 satisfies HWSpec's `> 0` validation; the value is unused.
  dtype_bytes: 2
  pim_burst_bytes: 128
  pim_column_access_ns: 4.0
  pim_columns_per_row: 32
  pim_pu_inbuf_bytes: 256
  pim_pu_lat_ns: 5.0
  pim_row_activate_ns: 31.0
  pim_row_bytes: 1024
  pim_bus_turnaround_ns: 31.0
  pim_write_read_row_cycle_ns: 66.0
  pim_row_close_ns: 29.0
  pim_accumulator_roundtrip_ns: 2.0
  memcpy_dtod_floor_ns: null

scheduling:
  parallel_unit: thread
  parallel_width: 1
  num_compute_units: 32
  max_warps_per_unit: 1
  max_blocks_per_unit: 1
  max_regs_per_unit: 128
  max_smem_per_unit_bytes: 65536
  max_smem_per_block_bytes: 65536
  max_threads_per_unit: 1
  dispatch_overhead_ns: 500
  model_clock_domain: pim_core
  dram_clock_domain: dram

interconnect:
  nvlink_unidir_bw_GB_s: null
  nvlink_signal_latency_ns: null
  nccl_alpha_ns: null
  pcie_bw_GB_s: null
  pcie_latency_ns: null
  infiniband_unidir_bw_GB_s: null

features:
  kernel_memory_model: pim_bank
  kernel_dtype: bf16
  l1_cache_enabled: false
  cluster_supported: false
  cluster_size: 0
  multicast_supported: false
  hw_decompression: false
  compression_ratio: 1.0
