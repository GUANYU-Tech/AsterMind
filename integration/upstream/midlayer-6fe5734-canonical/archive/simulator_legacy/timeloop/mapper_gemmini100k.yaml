# Archived Timeloop mapper config: 100k random search for Gemmini EagerAttn.
# EagerAttn is a DECOMPOSED UNFUSED UPPER BOUND (qkt_mm + softmax + pv_mm), NOT
# honest GT like GEMM — but at 100k search the mapping found is optimal (ratio
# GT/compute ≈ 1.0, same as GEMM@50k per docs/goal_gemmini_sub10.md sweep), so the
# upper bound is tight rather than the 5k mapper_fast's loose ~2.75× on GEMVs.
# 100k = 2× GEMM's 50k budget (the sweep showed 200k adds nothing over 50k, so
# 100k is well past the optimal-saturation point — chosen for thoroughness on the
# decomposed upper bound). A method knob (search budget), not MAPE-fitted (zero-
# fitting compliant, docs/design.md). GEMM/MoE keep mapper.yaml (50k, honest GT).
mapper:
  algorithm: random
  optimization_metrics:
  - delay
  search_size: 100000      # 2× GEMM's 50k; past optimal-saturation → tight upper bound
  victory_condition: 100000  # = search_size (no early-stop)
  timeout: 600             # 16-core pin; large prefill completes <600s (GEMM 50k largest = 37.9s)
