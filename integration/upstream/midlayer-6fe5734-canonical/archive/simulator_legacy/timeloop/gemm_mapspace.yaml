# Archived Timeloop mapspace retained for dataset reproducibility.
mapspace_constraints:
  - target: Registers
    type: bypass
    bypass: [Outputs, Inputs]
    keep: [Weights]
  - target: Accumulator
    type: bypass
    bypass: [Weights, Inputs]
    keep: [Outputs]
  - target: Scratchpad
    type: bypass
    keep: [Inputs, Weights]
    bypass: [Outputs]
  - target: DRAM
    type: bypass
    keep: [Weights, Inputs, Outputs]
    bypass: []
  - target: Accumulator
    type: spatial
    factors: M=1 N=1 K<=16
    permutation: KMN
  - target: Registers
    type: temporal
    factors: M=1 N=1 K=1
    permutation: MNK
  - target: Accumulator
    type: temporal
    permutation: MNK
