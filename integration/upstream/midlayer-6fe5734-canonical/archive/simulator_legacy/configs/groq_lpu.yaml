# Archived Timeloop dataset-generation config for Groq LPU.
modeling:
  output_dir: "ncu_dataset_groq_lpu"
  hw_config: "configs/hardware"
  hw_name: "groq_lpu"
  hardware: "groq_lpu"

emulation:
  output_dir: "trace_data_groq_lpu"

dataset_gen:
  gpu_device_id: null
  python_bin: "python3"
  timeloop_bin: "/share_data/yangxinhao/chip_modeling/timeloop/bin/timeloop-mapper"
  timeloop_env_prefix: "/home/yangxinhao_hermes/.conda/envs/timeloop"
  arch_yaml: "lpu_arch.yaml"
  mapspace_yaml: "lpu_mapspace.yaml"
  clock_ghz: 0.9
  pipeline_fill: 20
  sram_capacity_bytes: 230686720
  sim_timeout_s: 180
  nvidia_a800_routing_dataset: "kernel_dataset/nvidia_a800"
  kernel_support:
    gemm:
      config: "configs/kernel_dataset/workloads/common/gemm.yaml"
      runner: "scripts/kernel/dataset/gemm/run_kernel.py"
    flash_attn:
      config: "configs/kernel_dataset/workloads/common/flash_attn.yaml"
      runner: "scripts/kernel/dataset/flash_attn/run_kernel.py"
    eager_attn:
      config: "configs/kernel_dataset/workloads/common/flash_attn.yaml"
      runner: "scripts/kernel/dataset/flash_attn/run_kernel.py"
    fused_moe:
      config: "configs/kernel_dataset/workloads/common/fused_moe.yaml"
      runner: "scripts/kernel/dataset/fused_moe/run_kernel.py"
    vector:
      config: "configs/kernel_dataset/workloads/common/vector.yaml"
      runner: "scripts/kernel/dataset/vector/run_kernel.py"
  compute_scale: 1600
  sram_bandwidth_b_per_cyc: 61111
