<aside class="studio-sidebar" aria-label="计算 Cell 工作区"><div class="studio-nav-label">计算 Cell 仿真</div><p class="studio-nav-hint">沿步骤完成</p><button class="cell-overview" type="button" data-action="home">工作区概览</button><nav class="chapter-rail" id="chapter-rail" aria-label="实验配置进度"><span class="chapter-progress" id="chapter-progress"></span></nav><div class="studio-sidefoot"><button id="show-history" type="button"><span class="record-icon" aria-hidden="true"></span>任务记录</button><a class="docs-link" href="/assets/guide.html"><span class="docs-icon" aria-hidden="true"></span>技术文档</a><a href="/"><span aria-hidden="true">←</span>返回仿真工作区</a></div></aside>
<div class="cell-home-frame" data-home-only><div class="workspace-entry-art cell-entry-art" role="img" aria-label="地球与计算卫星编队示意图"></div></div>
