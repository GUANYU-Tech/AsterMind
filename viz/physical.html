<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrbitServe 物理模型</title><link rel="stylesheet" href="/assets/pages.css"><style>.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}label{display:flex;flex-direction:column;gap:7px;font-size:13px}input,textarea{font:inherit;padding:9px;background:#101e31;color:#edf4ff;border:1px solid #395272;border-radius:6px}input[type=checkbox]{align-self:flex-start}textarea{width:100%;min-height:220px;font:12px monospace}.card{margin:14px 0}.sticky{position:sticky;bottom:0;background:#0c1422f5;padding:14px;border-top:1px solid #395272}#count{color:#8de0b3}.danger{color:#ffacb4}</style><main class="physical-page">
<nav><a href="/experiments?state=running">正在运行的任务</a><a href="/experiments">任务管理</a><a href="/">← 工作台</a><strong>第一步 物理模型</strong></nav><a class="back-to-configuration" href="/configuration">← 返回</a><h1>物理场景</h1><div class="fields"><label>模型名称<input id="name" aria-label="模型名称" value="Starlink 550 (72 × 22, 2 Cells)"></label><label>物理场景预设<select id="preset" disabled aria-describedby="presetDescription"><option value="starlink_550" data-model-name="Starlink 550 (72 × 22)">标准星座（72 × 22，600 秒）</option><option value="sharing_demo" data-model-name="Concurrent Link Sharing (60 s)">并发共享（60 秒）</option><option value="fault_recovery" data-model-name="Backup Path (40 s)">备用路径（40 秒）</option></select></label></div><p id="count"></p><p id="presetDescription" aria-live="polite"></p>
<section class="card" id="tleImport"><h2>导入通信星座</h2><p>导入单壳层文件将替换通信星座；保留计算编队与地面站。上限 2500 颗。</p><div class="fields"><label>单壳层 TLE 文件<input id="tleFile" aria-label="单壳层 TLE 文件" type="file" accept=".tle,.txt"></label><button id="importTle" class="primary" disabled>导入文件并生成通信星座</button></div><a href="/assets/single-shell.tle" download="single-shell.tle">下载单壳层 TLE 模板（4 星示例）</a><p id="tleStatus" role="status"></p></section>
<div class="tabs" role="tablist"><button data-tab="geometry" role="tab" aria-selected="true">星座与时间</button><button data-tab="ground" role="tab">地面站</button><button data-tab="links" role="tab">连接与链路预算</button></div>
<section data-panel="geometry"><label>场景类型<select id="scenarioType" aria-label="场景类型"><option value="mixed">混合 计算卫星 + 通信卫星</option><option value="compute_only">纯计算卫星 cell 直接接地</option><option value="communication_only">纯通信卫星 网络与转发诊断</option></select></label><p id="scenarioNote"></p><div id="time" class="fields"></div><h2>通信星座</h2><div id="shells"></div><button id="addShell">＋ 通信壳层</button><h2>算力星座</h2><div id="cells"></div><button id="addCell">＋ 算力星座</button></section>
<section data-panel="ground" hidden><h2>地面站与接入</h2><p>设置地面站位置、终端数量与接入策略。</p><p>请求负载须使用相同的地面站 ID 与坐标。</p><div id="grounds"></div><button id="addGround">＋ 地面站</button><div id="access" class="fields"></div></section>
<section data-panel="links" hidden><h2>计算卫星—通信卫星建链规则</h2><p>设置跨层接入；切换策略在“地面站”中配置。</p><div id="connections" class="fields"></div><h2>按每个方向计算的物理链路预算</h2><p>通用链路预算。壳层专属预算可在“星座与时间”中修改。</p><div id="budgets"></div></section>
<details><summary>完整物理模型 JSON</summary><div id="json"></div></details><p id="status" role="status"></p><div class="actions sticky"><button id="save">保存配置草稿</button><button id="preview">生成并预览</button><button id="next" class="primary">生成数据并继续 →</button></div></main><script type="module" src="/assets/physical_editor.js"></script></html>
