<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrbitServe 运行进度</title><link rel="stylesheet" href="/assets/pages.css"><main>
<nav><a href="/experiments?state=running">正在运行的任务</a><a href="/experiments">任务管理</a><a href="/configuration">← 实验配置</a><a href="/experiments">历史实验</a></nav>
<div class="steps">① 配置 <strong>② 运行</strong> ③ 结果</div><h1 id="heading">实验运行中</h1><p id="runId"></p>
<section class="card" aria-live="polite"><h2 id="state">正在读取运行状态…</h2><p id="phase">完成后自动进入结果页。可以离开此页，稍后通过此地址继续查看。</p><p id="error" class="error"></p><div class="actions"><a id="result" class="button primary" hidden>查看结果</a><button id="refresh" type="button">刷新状态</button><span id="refreshFeedback" role="status" hidden><span>上次刷新</span> <time id="refreshTime"></time></span></div></section>
<h2 id="execution-log" tabindex="-1" style="scroll-margin-top:5rem">执行日志</h2><pre id="log">等待日志…</pre>
<details id="diagnostics" hidden><summary>原始诊断日志（末尾）</summary><pre id="rawLog" data-raw></pre></details>
<section class="card"><h2>手动管理</h2><div id="taskActions"></div></section></main>
<script type="module">
import {formatTaskLog,taskFailure,taskPhase} from '/assets/progress_log.js';
import {completedDestination} from '/assets/experiment_flow.js';
import {renderTask} from '/assets/task_manager.js';

const $ = id => document.getElementById(id);
const base = location.pathname.replace(/progress$/, '');
const id = base.split('/')[2];
const query = new URLSearchParams(location.search);
const labels = {running:'正在运行', completed:'运行完成', failed:'运行失败', interrupted:'运行已中断', cancelled:'已手动停止', stopping:'正在停止'};
let poll, busy=false, first=true, lastControls;
$('runId').textContent = id;

function render(job) {
  const running = job.state === 'running';
  const completed = job.state === 'completed';
  $('state').textContent = labels[job.state] || job.state;
  $('heading').textContent = completed ? '实验已完成' : running ? '实验运行中' : '实验需要检查';
  $('phase').textContent = taskPhase(job) || (running ? '正在执行仿真与生成展示数据，完成后自动进入结果页。' : '运行状态已保存。');
  const log = formatTaskLog(job) || '尚无执行日志。';
  if ($('log').textContent !== log) $('log').textContent = log;
  $('error').textContent = taskFailure(job);
  $('diagnostics').hidden = !job.log_tail;
  if ($('rawLog').textContent !== (job.log_tail || '')) $('rawLog').textContent = job.log_tail || '';
  if (job.preview_url && running) {
    $('heading').textContent = '准备物理场景演示';
    $('phase').textContent = '只生成位置、拓扑和链路属性；完成后进入物理回放。';
  }
  $('result').hidden = !completed;
  if (completed) {
    const destination = completedDestination(job, location.search);
    $('result').href = destination;
    if (query.get('next') === 'scene' && job.physical_model_id) {
      $('result').textContent = '进入第二步';
      $('heading').textContent = '完整物理数据已生成';
    } else {
      $('result').textContent = query.get('next') === 'replay' ? '查看结果与回放' : job.preview_url ? '查看物理场景' : '查看结果';
    }
    if (!query.has('stay')) location.replace(destination);
  }
  const target = $('taskActions');
  const signature = JSON.stringify([job.state, job.phase, job.error, job.preview_url, job.runtime_url, job.can_stop, job.can_rerun, job.can_delete, job.can_stop_and_delete]);
  if (lastControls !== signature && !target.querySelector('button:disabled')) {
    target.replaceChildren();
    renderTask(target, {...job, title:id}, {onProgressPage:true});
    lastControls = signature;
  }
  if (first && location.hash === '#execution-log') {
    $('execution-log').focus({preventScroll:true});
    $('execution-log').scrollIntoView({block:'start'});
  }
  first = false;
}

async function update(manual=false) {
  if (busy) return;
  busy = true;
  clearTimeout(poll);
  $('refresh').disabled = true;
  if (manual) $('refresh').textContent = '正在刷新状态…';
  try {
    const response = await fetch(base+'status', {cache:'no-store'});
    const job = await response.json();
    if (!response.ok) throw Error(job.error || '无法读取任务');
    render(job);
    if (manual) {
      const now = new Date();
      $('refreshTime').dateTime = now.toISOString();
      $('refreshTime').textContent = now.toLocaleTimeString();
      $('refreshFeedback').hidden = false;
    }
    if (['running','stopping','preparing','paused'].includes(job.state) || job.replay_state === 'preparing') poll = setTimeout(update,1500);
  } catch (error) {
    $('state').textContent = '暂时无法读取状态';
    $('error').textContent = error.message;
    poll = setTimeout(update,4000);
  } finally {
    busy = false;
    $('refresh').disabled = false;
    if (manual) $('refresh').textContent = '刷新状态';
  }
}
$('refresh').onclick = () => update(true);
document.addEventListener('taskschange', () => update());
update();
</script></html>
