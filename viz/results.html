<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astermind 星鉴 · 实验结果</title><link rel="stylesheet" href="/assets/pages.css"><link rel="stylesheet" href="/assets/result_center.css"><script type="importmap">{"imports":{"three":"/assets/three.module.js","three/webgpu":"/assets/three.module.js"}}</script></head><body><main class="result-center">
<header class="result-heading"><div><p class="studio-eyebrow">EXPERIMENT / ANALYSIS</p><h1>实验结果</h1><p id="runIdentity" class="run-identity"></p></div><div class="actions"><span id="resultState" class="result-badge">读取中</span><a href="/experiments" class="button">运行记录</a><a id="changeExperiment" class="button" href="/results" hidden>切换实验</a><a id="configureRun" class="button" hidden>复用配置</a></div></header>
<p id="resultNotice" role="status" aria-live="polite">正在读取实验…</p><section id="resultSelection" class="result-selection card" hidden><p class="studio-eyebrow">SELECT EXPERIMENT</p><h2>选择实验</h2><label for="resultRunSelect">实验记录</label><select id="resultRunSelect" aria-label="实验记录" disabled><option value="">请选择实验</option></select><div class="actions"><button id="openSelectedResult" class="primary" disabled>查看结果 →</button><a class="button" href="/configuration">新建任务</a></div></section><div id="pendingActions" class="actions"></div><div id="resultBody" hidden>
<nav class="analysis-tabs" aria-label="实验结果分析"><a href="#requests" data-view="requests">请求性能</a><a href="#charts" data-view="charts">数据图表</a><a href="#scene" data-view="scene">场景回放</a><a href="#operators" data-view="operators">算子与通信</a><a href="#kv" data-view="kv">KV 与校验</a></nav>
<section data-panel="requests"><div id="performanceMetrics" class="result-metrics"></div><section class="card"><div class="section-title"><div><h2>服务响应明细</h2></div><button id="exportRequests">导出筛选结果 CSV</button></div>
<div class="result-filters"><label>查找请求<input id="requestSearch" type="search" placeholder="请求 ID"></label><label>计算 Cell<select id="requestCell"><option value="">全部 Cell</option></select></label><label>执行状态<select id="requestState"><option value="">全部状态</option><option value="completed">已完成</option><option value="incomplete">未完成</option></select></label><label>排序<select id="requestSort"><option value="arrival">到达时间</option><option value="latency">响应时间从长到短</option><option value="ttft">TTFT 从长到短</option></select></label></div>
<div id="requestTable" class="result-table"></div><div class="result-pagination"><span id="requestCount" role="status"></span><div class="actions"><button id="previousRequests">上一页</button><button id="nextRequests">下一页</button></div></div>
</section><section class="card"><h2>请求阶段耗时</h2><div id="phaseTable" class="result-table"></div></section></section>
<section data-panel="charts" hidden><div class="section-title"><h2>请求性能分布</h2><label>分析指标<select id="chartMetric"><option value="latency_s">端到端时延</option><option value="ttft_s">TTFT</option><option value="tpot_s">TPOT</option></select></label></div><div class="chart-grid"><section class="card"><h3>时延分布 / s</h3><div id="histogram" class="result-chart"></div></section><section class="card"><h3>累计分布</h3><div id="cdf" class="result-chart"></div></section></div><section class="card"><h3>逐请求响应 / s</h3><div id="requestChart" class="result-chart"></div></section><section class="card"><h3>分位数 / s</h3><div id="percentiles" class="result-table"></div></section></section>
<section data-panel="scene" hidden><div class="analysis-tool-head"><div><h2>场景回放</h2></div><span class="result-badge replay">只读回放</span></div><div id="sceneTool"></div></section>
<section data-panel="operators" hidden><div class="analysis-tool-head"><div><h2>算子与通信分析</h2></div><span class="result-badge replay">只读分析</span></div><div id="operatorSummary" class="chart-grid"></div><div id="operatorTool"></div></section>
<section data-panel="kv" hidden><div class="analysis-tool-head"><div><h2>KV 与一致性校验</h2></div><span class="result-badge replay">只读分析</span></div><div id="kvSummary" class="card"></div><div id="kvTool"></div></section>
<footer class="result-footer"><span id="resultMethod"></span><a id="rawResult" download>下载完整结果</a></footer></div></main><script type="module" src="/assets/result_center.js"></script></body></html>
