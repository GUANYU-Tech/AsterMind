<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>场景回放 已保存记录</title><link rel="stylesheet" href="/assets/pages.css"><style>.replay-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 0}.replay-controls input[type=range]{flex:1;min-width:180px}#replayClock{font:20px var(--mono-font,monospace);color:#add3e2}.scene-record>h1{font-size:21px}.scene-record #globe+div{height:520px!important}.scene-record #replaySelection{padding:12px;border-left:2px solid #8ebbc9;white-space:pre-line}.scene-record [hidden]{display:none!important}.replay-log-counts{font-size:12px;margin:10px 0 18px}.replay-log-counts table{width:100%;border-collapse:collapse}.replay-log-counts th,.replay-log-counts td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left}.replay-log-counts summary{cursor:pointer;color:var(--muted)}</style></head><body><main class="scene-record"><h1>场景回放</h1><p>已保存记录 仅回放，不发送运行或故障指令</p><div class="replay-controls"><button id="replayPlay">播放记录</button><button id="replayStart">回到起点</button><label>倍速<select id="replayRate"><option value="1">1×</option><option value="10" selected>10×</option><option value="60">60×</option></select></label><input id="replaySeek" type="range" min="0" max="1" step="0.001" value="0" aria-label="回放时间"><output id="replayClock">0.000 s</output></div><p id="replayStatus" role="status">读取已保存的事件…</p><div id="globe"></div><p id="replaySelection">选择节点或链路查看此时刻状态。</p><section class="replay-log-counts"><div class="section-head"><h2 id="replayLogTitle">执行记录</h2><label>记录类型<select id="replayEventFilter" aria-label="记录类型"><option value="business">请求与计算通信</option><option value="network">场景与网络</option><option value="diagnostic">内部诊断</option></select></label></div><p id="replayLogProgress"></p><div style="max-height:320px;overflow:auto"><table><thead><tr><th>仿真时间 / s</th><th>记录</th><th>请求 / 对象</th><th>详情</th></tr></thead><tbody id="replayEventRows"></tbody></table></div><details><summary>当前类别的记录构成</summary><div id="replayLogCounts"></div></details></section><p id="hopInfo"></p><p id="nodeInfo"></p><div id="cellDirectory" hidden></div></main><script type="importmap">{"imports":{"three":"/assets/three.module.js","three/webgpu":"/assets/three.module.js"}}</script><script type="module" src="/assets/scene_replay.js"></script></body></html>
