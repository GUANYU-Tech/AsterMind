<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astermind 星鉴 · 实验配置</title><link rel="stylesheet" href="/assets/pages.css"></head><body><main>
<p class="studio-eyebrow">CONFIGURATION</p><h1>实验配置</h1>
<div class="two-column"><section class="card config-step"><span class="step-number">01</span><h2>物理场景</h2><p>星座、地面站与物理链路。</p><label>已有物理模型<select id="models" aria-label="已有物理模型"></select></label><div class="actions"><button id="editModel" disabled>编辑所选模型</button><a class="button primary" href="/physical">新建物理模型 →</a></div></section>
<section class="card config-step"><span class="step-number">02</span><h2>业务与部署</h2><p>请求负载、模型部署与运行策略。</p><label>已有完整场景<select id="scenes" aria-label="已有完整场景"></select></label><div class="actions"><button id="editScene" disabled>编辑所选场景</button><a class="button primary" href="/scene">新建完整场景 →</a></div></section></div>
<section class="card"><h2>启动仿真</h2><a class="button" href="/live">进入在线实验台 →</a></section><p id="status" role="status"></p>
</main><script type="module">import {get,fillOptions} from '/assets/studio_common.js';const $=id=>document.getElementById(id);Promise.all([get('/physical-catalog'),get('/scene-catalog')]).then(([models,scenes])=>{fillOptions($('models'),models);fillOptions($('scenes'),scenes);$('editModel').disabled=!models.length;$('editScene').disabled=!scenes.length}).catch(e=>$('status').textContent=e.message);$('editModel').onclick=()=>location.href='/physical?id='+encodeURIComponent($('models').value);$('editScene').onclick=()=>location.href='/scene?id='+encodeURIComponent($('scenes').value);</script></body></html>
