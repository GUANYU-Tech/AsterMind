<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrbitServe 原生场景结果</title><link rel="stylesheet" href="/assets/pages.css"><style>table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--border)}.table-wrap{overflow:auto}</style></head><body><main><nav><a href="/results">← 实验结果</a><a id="edit">复用场景</a></nav><h1>场景执行结果</h1><p id="method"></p><section id="metrics" class="metrics"></section><section class="card"><h2>请求交付</h2><div class="table-wrap"><table><thead><tr><th>请求</th><th>Cell</th><th>状态</th><th>端到端耗时</th><th>接收 token</th></tr></thead><tbody id="requests"></tbody></table></div></section><p id="audit" role="status"></p><div class="actions"><a id="replay" class="button primary">GPU 算子与通信回放 ↗</a><a id="live" class="button">地球与卫星场景</a><a id="raw" download class="button">下载完整运行记录</a></div><p id="error" class="error"></p></main><script type="module">
const base=location.pathname.replace(/result$/,''),id=base.split('/')[2],$=s=>document.getElementById(s);
document.querySelector('h1').textContent=new URLSearchParams(location.search).has('current')?'当前实验结果':'实验运行结果';
const historyLink=document.createElement('a');historyLink.href='/experiments';historyLink.textContent='运行记录';document.querySelector('nav').append(historyLink);
$('edit').href='/scene?run='+id;$('replay').href=base+'native-replay/index.html';$('live').href='/live/'+id;$('raw').href=base+'native-result';
try{const response=await fetch(base+'native-summary'),r=await response.json();if(!response.ok)throw Error(r.error);$('method').textContent=r.communication_label+' GPU 计算使用 AsterMind';
for(const [label,value]of [['GPU 数',r.gpu_count],['V1 点到点传输',r.flows],['旧通信模型统计',r.surrogate_operations],['事件执行用时',r.measurement.event_loop_wall_s.toFixed(3)+' s']]){const card=document.createElement('div');card.className='card';const small=document.createElement('small'),strong=document.createElement('strong');small.textContent=label;strong.textContent=value??'不可用';card.append(small,strong);$('metrics').append(card)}
for(const [key,q]of Object.entries(r.requests)){const tr=document.createElement('tr');for(const value of [key,q.cell_id||q.cell||'—',q.status==='completed'?'已完成':q.status,q.completed_ns==null?'—':((q.completed_ns-q.arrival_ns)/1e6).toFixed(3)+' ms',q.received_tokens]){const td=document.createElement('td');td.textContent=value;tr.append(td)}$('requests').append(tr)}
$('audit').textContent=r.audit.passed?'因果与通信屏障检查通过。':'请求未全部完成，请检查运行记录。';
}catch(e){$('error').textContent=e.message}
</script></body></html>
