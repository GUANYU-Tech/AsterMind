[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "-n", "48"]
markers = [
    "integration: crosses an owner or process boundary without requiring production hardware",
    "scheduler: starts one or more real vLLM Scheduler subprocesses",
    "scheduler_smoke: representative real-Scheduler coverage for Serving changes",
    "slow: retained regression coverage excluded from the default pre-commit gate",
]
