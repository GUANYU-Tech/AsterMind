[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "-n", "96", "--dist=load", "--maxschedchunk=1"]
markers = [
    "integration: crosses an owner or process boundary without requiring production hardware",
    "scheduler: starts one or more real vLLM Scheduler subprocesses",
    "scheduler_smoke: representative real-Scheduler coverage for Serving changes",
    "slow: retained high-cost regression coverage; use an explicit marker selection for targeted runs",
]
