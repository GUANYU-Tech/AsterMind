hardware_id: samsung_hbm_pim
# ============================================================
# HBM-PIM (Samsung) Hardware Spec — PIM near-memory compute model
# ============================================================
# 来源: UniNDP (HPCA25) config/hbm-pim.yaml = Arch 4 (Samsung-HBM2 PIM),
#        Table III. PIM 把 MAC 单元放进 DRAM bank 旁, 就近计算, 无 GPU 式
#        SM/L2 层级。本 spec 把 UniNDP 的 bank/PU/通道几何与时序参数移植到
#        本项目的 HWSpec V3 component-tree schema, 供 forward 预测器加载。
#
# UniNDP hbm-pim.yaml 关键参数 (验证: M=1,K=N=4096 -> 10312 ns):
#   data_pr=16 (FP16), ch=64 通道, ra=1, de=1, ba=4, bg=4 (16 bank/device),
#   de_pu=[8] (8 PU/device -> 512 PU 系统), co_w=256 bit/列, co=32 列 (1KB 行),
#   simd = co_w/data_pr = 16 FP16 MAC/PU/cyc, BL=4, burst=128B,
#   tCK=1ns (time interval), read_row_change_apox=31 tick, tCCDL=4 tick。
# 注: PIM 无真实 L2 cache; HWSpec 校验要求 l2_cache capacity>0 (hardware_spec.py:238),
#     故保留 8MB 占位 L2 (forward GEMM 在 kernel_name_encodes_tile=false 时走
#     解析流量路径, L2 占位值不进入 actual_ns, 仅满足加载校验)。
# ============================================================
# ─── Clock domains ────────────────────────────────────────
# UniNDP tCK=1ns -> 1GHz tick; PU 与 DRAM core 同域 (PIM 在 DRAM 旁计算)。
# 使用 UniNDP 的 tCK=1ns，即 1GHz PU/DRAM 建模时钟。
clock_domains:
  pim_core: 1000000000
  dram: 1000000000

# ─── Components: PIM cores (one per PU) + shared DRAM/L2/xbar ───
components:
  # ═══ 512 PIM cores (one per PU: 64ch × 1device × 8 PU) ═══
  - name: pim_core
    count: 512                          # [UniNDP] 64 ch × 8 PU/device = 512 PU
    children:
      - name: mac_unit
        role: compute_tensor
        scope: shared
        count: 1
        type: compute
        primary_variant: fp16
        variants:
          - name: fp16
            throughput_per_clk: 8        # [UniNDP] simd=16 MAC/op and pu_lat=4
                                           # cycles (max(tCCDL=4, BL/2=2)):
                                           # 16/4 MAC/cycle × 2 FLOP/MAC.
          - name: int8
            throughput_per_clk: 32      # 2× fp16 (UniNDP 只建模 FP16; int8 为本项目假设)
      - name: scalar_pipe
        role: compute_fma
        scope: shared
        count: 1
        type: compute
        throughput_per_clk: 4       # [UniNDP] the PU has ONE datapath: simd=16
                                    #   lanes / pu_lat=4 ns = 4 element/ns. There
                                    #   is no separate scalar/SFU/ALU issue port.
      - name: sfu_pipe
        role: compute_sfu
        scope: shared
        count: 1
        type: compute
        throughput_per_clk: 4       # [UniNDP] the PU has ONE datapath: simd=16
                                    #   lanes / pu_lat=4 ns = 4 element/ns. There
                                    #   is no separate scalar/SFU/ALU issue port.
      - name: alu_pipe
        role: compute_alu
        scope: shared
        count: 1
        type: compute
        throughput_per_clk: 4       # [UniNDP] the PU has ONE datapath: simd=16
                                    #   lanes / pu_lat=4 ns = 4 element/ns. There
                                    #   is no separate scalar/SFU/ALU issue port.
      - name: local_buffer
        role: smem
        scope: shared
        count: 1
        type: memory
        throughput_per_clk: 256
        traffic_filter: null
      - name: l1_cache
        role: l1_cache
        scope: shared
        count: 1
        type: memory
        throughput_per_clk: 128
        traffic_filter: null

  # ═══ Shared DRAM (HBM-PIM, 16GB) ════════════════════════
  - name: dram
    role: dram
    scope: shared
    clock_domain: dram
    count: 1
    type: memory
    # [UniNDP] per-channel ~6.4GB/s @ 800MHz ≈ 8 B/clk (co_w=32B per 4-tick 列时间)
    throughput_per_clk: 8
    traffic_filter: page_conflict
    size_bytes: 17179869184            # 16GB = 64ch × 16bank × 1KB × 16384row
    num_partitions: 64                  # 64 通道 (page_conflict 在通道粒度)

  # ═══ 占位 L2 (PIM 无真实 L2; 满足 HWSpec capacity>0 校验) ═══
  - name: l2
    role: l2_cache
    scope: shared
    clock_domain: pim_core
    count: 1
    type: memory
    throughput_per_clk: 1500
    traffic_filter: lru
    size_bytes: 8388608                 # 8MB 占位
    num_partitions: 16

  # ═══ Crossbar ═══════════════════════════════════════════
  - name: xbar
    role: xbar
    scope: shared
    clock_domain: pim_core
    count: 1
    type: memory
    throughput_per_clk: 2000
    traffic_filter: null

# ─── Resource groups ─────────────────────────────────────
resource_groups:
  - name: tensor_pipe
    members: [mac_unit_fp16]
  - name: fma_sfu_pipe
    members: [scalar_pipe, sfu_pipe]
  - name: alu_pipe
    members: [alu_pipe]
  - name: smem
    members: [local_buffer]
  - name: l1_cache
    members: [l1_cache]
  - name: xbar
    members: [xbar]
  - name: l2
    members: [l2]
  - name: dram
    members: [dram]

# ─── Memory subsystem ────────────────────────────────────
# UniNDP-derived latencies (tick=1ns); PIM near-memory 就近计算, 无 L2 hit 串行。
memory_subsystem:
  dram_latency_ns: 38.75               # [UniNDP] read_row_change_apox=31 tick × 1.25ns
  l2_latency_ns: 0                     # PIM 无 L2 hit 串行修正
  cacheline_bytes: 128                 # [UniNDP] burst = BL×co_w/8 = 4×256/8 = 128B
  l2_conflict_efficiency_moe: 0.9
  dram_protocol_efficiency: 0.95
  dram_protocol_efficiency_l1cached: 1.0
  profiler_per_kernel_traffic_reliable: true
  dtype_bytes: 2                  # FP16 (UniNDP data_pr=16)
  # PIM bank-parallel params (UniNDP hbm-pim derived)
  pim_row_bytes: 1024                # [UniNDP] co=32 columns × co_w/8=32 B = 1024 B per row
  pim_row_activate_ns: 31.0          # [UniNDP] read row cycle =
                                     #   tRCDRD(14)+tRP(14)+BL/2(2)+max(tRTPL-tCCDL,0)(1)
  pim_column_access_ns: 4.0         # [UniNDP] tCCDL=4 tick × 1ns (column read latency)
  pim_columns_per_row: 32            # [UniNDP] co=32 columns per row
  pim_burst_bytes: 128               # [UniNDP] burst = BL×co_w/8 = 4×32 = 128B
  # ── Bank-stream protocol composites (DDR command timings, UniNDP hbm-pim) ──
  # A PIM PU consumes its operands straight out of an open DRAM row, so every
  # phase of the DDR row/column protocol sits in the PU's critical path.  The
  # four composites below are the standard protocol costs of that path; each is
  # a pure function of the vendor command timings above.
  pim_pu_lat_ns: 4.0                # [UniNDP] pu_lat = max(tCCDL=4, BL/2=2): one
                                    #   SIMD MAC group, exactly one column slot
  pim_pu_inbuf_bytes: 256           # [UniNDP] de_pu_inbuf=2048 bit = 256 B (the PU input buffer; sets
                                    #   buffer_col = inbuf/co_w = 256/32 = 8 columns per bank-access chunk)
  pim_bus_turnaround_ns: 31.0       # [UniNDP] write→read bus turnaround inside an
                                    #   open row: tWTRL(9) + RL(20) + BL/2(2)
  pim_write_read_row_cycle_ns: 66.0 # [UniNDP] row change after a write burst:
                                    #   tWR(16)+tRP(14)+tRCDRD(14)+RL(20)+BL/2(2)
  pim_row_close_ns: 29.0            # [UniNDP] the close+reopen an operation's very
                                    #   first row does not pay:
                                    #   tRP(14)+tRCDRD(14)+BL/2(2)-max(tRTPL-tCCDL,0)(1)
  pim_accumulator_roundtrip_ns: 2.0 # [UniNDP] de_pu_bf_rl(1) + de_pu_bf_wl(1): the
                                    #   PU accumulator register ↔ output buffer trip
  memcpy_dtod_floor_ns: null

# ─── Scheduling ──────────────────────────────────────────
scheduling:
  parallel_unit: thread
  parallel_width: 1
  num_compute_units: 512               # 512 PU
  max_warps_per_unit: 1
  max_blocks_per_unit: 1
  max_regs_per_unit: 128
  max_smem_per_unit_bytes: 65536
  max_smem_per_block_bytes: 65536
  max_threads_per_unit: 1
  dispatch_overhead_ns: 0    # No independent runtime-launch anchor is modeled.
  model_clock_domain: pim_core
  dram_clock_domain: dram

interconnect:
  nvlink_unidir_bw_GB_s: null
  nvlink_signal_latency_ns: null
  nccl_alpha_ns: null
  pcie_bw_GB_s: null
  pcie_latency_ns: null
  infiniband_unidir_bw_GB_s: null

# ─── Features ────────────────────────────────────────────
features:
  kernel_memory_model: pim_bank
  kernel_dtype: bf16
  l1_cache_enabled: false
  cluster_supported: false
  cluster_size: 0
  multicast_supported: false
  hw_decompression: false
  compression_ratio: 1.0
