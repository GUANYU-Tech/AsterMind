hardware_id: ucb_gemmini
# ============================================================
# Gemmini Hardware Spec — dataflow systolic-array accelerator
# ============================================================
# 来源: Gemmini (ucb-bar, ISCA21) GemminiConfigs.defaultConfig =
#        GemminiRocketConfig. 16×16 output-stationary systolic mesh, INT8,
#        256KB scratchpad, 64KB accumulator, 128-bit DMA bus. 40nm。
#        本 spec 把 Gemmini RTL 参数移植到本项目 HWSpec V3 schema。
#
# latency groundtruth 由 build_ucb_gemmini_dataset.py 调用 Timeloop 仿真器
# (NVlabs/timeloop, cycle-accurate mapping search) 给出, Cycles @1GHz → ns。
# 历史生成器与 Timeloop 配置保存在 archive/simulator_legacy/。
#
# 注: systolic dataflow 架构无 GPU 式 SM/L2 层级; HWSpec 校验要求 l2_cache
#     capacity>0 (hardware_spec.py:238), 故保留 8MB 占位 L2 (forward 在
#     kernel_name_encodes_tile=false 时走解析流量路径, L2 占位不进入 actual_ns)。
# ============================================================
clock_domains:
  tile: 1000000000
  dram: 1000000000

components:
  # ═══ Gemmini core: one 16×16 systolic mesh (256 MAC) ═══
  - name: gemmini_core
    count: 1                            # 单个 systolic array (非多核)
    clock_domain: tile                  # 继承 tile clock (1GHz) 给 mac_mesh
    children:
      - name: mac_mesh
        role: compute_tensor
        scope: shared
        count: 1
        type: compute
        primary_variant: int8
        variants:
          - name: int8
            throughput_per_clk: 512     # 16×16 = 256 INT8 MAC/cyc = 512 FLOP/cyc (demand uses 2*MAC=FLOPs)
          - name: fp16
            throughput_per_clk: 128     # Gemmini 原生 INT8; fp16 为本项目占位
      - name: scalar_pipe
        role: compute_fma
        scope: shared
        count: 1
        type: compute
        throughput_per_clk: 16
      - name: sfu_pipe
        role: compute_sfu
        scope: shared
        count: 1
        type: compute
        throughput_per_clk: 4
      - name: alu_pipe
        role: compute_alu
        scope: shared
        count: 1
        type: compute
        throughput_per_clk: 16
      - name: scratchpad               # [Gemmini] sp_capacity=256KiB, sp_banks=4
        role: smem
        scope: shared
        count: 1
        type: memory
        throughput_per_clk: 16          # 128-bit DMA bus = 16 B/cyc
        traffic_filter: null
      - name: l1_cache
        role: l1_cache
        scope: shared
        count: 1
        type: memory
        throughput_per_clk: 16
        traffic_filter: null

  # ═══ Shared DRAM ════════════════════════════════════════
  - name: dram
    role: dram
    scope: shared
    clock_domain: dram
    count: 1
    type: memory
    throughput_per_clk: 16              # 128-bit DMA bus = 16 B/cyc
    traffic_filter: page_conflict
    size_bytes: 1073741824              # 1GB 占位
    num_partitions: 4                   # sp_banks=4

  # ═══ 占位 L2 (systolic 无真实 L2; 满足 HWSpec capacity>0 校验) ═══
  - name: l2
    role: l2_cache
    scope: shared
    clock_domain: tile
    count: 1
    type: memory
    throughput_per_clk: 1500
    traffic_filter: lru
    size_bytes: 8388608                 # 8MB 占位
    num_partitions: 16

  # ═══ Crossbar ═══════════════════════════════════════════
  - name: xbar
    role: xbar
    scope: shared
    clock_domain: tile
    count: 1
    type: memory
    throughput_per_clk: 2000
    traffic_filter: null

resource_groups:
  - name: tensor_pipe
    members: [mac_mesh_int8]
  - name: fma_sfu_pipe
    members: [scalar_pipe, sfu_pipe]
  - name: alu_pipe
    members: [alu_pipe]
  - name: smem
    members: [scratchpad]
  - name: l1_cache
    members: [l1_cache]
  - name: xbar
    members: [xbar]
  - name: l2
    members: [l2]
  - name: dram
    members: [dram]

memory_subsystem:
  dram_latency_ns: 20.0
  l2_latency_ns: 0
  cacheline_bytes: 16                 # 128-bit DMA bus = 16 B
  l2_conflict_efficiency_moe: 0.9
  dram_protocol_efficiency: 0.95
  dram_protocol_efficiency_l1cached: 1.0
  profiler_per_kernel_traffic_reliable: true
  systolic_dma_bus_bpc: 16          # 128-bit DMA bus = 16 B/cyc
  pipeline_fill: 0
  dtype_bytes: 2                  # FP16 (matches Timeloop traffic convention)
  memcpy_dtod_floor_ns: null

scheduling:
  parallel_unit: thread
  parallel_width: 1
  num_compute_units: 1
  max_warps_per_unit: 1
  max_blocks_per_unit: 1
  max_regs_per_unit: 128
  max_smem_per_unit_bytes: 262144      # 256KB scratchpad
  max_smem_per_block_bytes: 262144
  max_threads_per_unit: 1
  dispatch_overhead_ns: 0    # No independent runtime-launch anchor is modeled.
  model_clock_domain: tile
  dram_clock_domain: dram

interconnect:
  nvlink_unidir_bw_GB_s: null
  nvlink_signal_latency_ns: null
  nccl_alpha_ns: null
  pcie_bw_GB_s: null
  pcie_latency_ns: null
  infiniband_unidir_bw_GB_s: null

features:
  kernel_memory_model: systolic_scratchpad
  kernel_dtype: bf16
  l1_cache_enabled: false
  cluster_supported: false
  cluster_size: 0
  multicast_supported: false
  hw_decompression: false
  compression_ratio: 1.0
